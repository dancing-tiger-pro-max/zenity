# The broker: NATS with JetStream, one pod, on a persistent disk so streams,
# the cursor and tombstones survive a restart. Production: a 3-node cluster.
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: bsky-router
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222 }
    - { name: monitor, port: 8222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: bsky-router
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2.11.8
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { containerPort: 4222 }
            - { containerPort: 8222 }
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: 8222 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Holds every stream: the sum of their max_bytes in config.yaml (~3.5GB) plus headroom.
        resources:
          requests: { storage: 5Gi }
